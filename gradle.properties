# Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Retry dependency downloads with backoff (CI runners sometimes get HTTP 429 from repositories).
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=2000

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Do NOT put secrets or the GitHub OAuth client ID here.
# Local builds: pass -Pgcode.githubClientId=<id> or export GCODE_GITHUB_CLIENT_ID.
